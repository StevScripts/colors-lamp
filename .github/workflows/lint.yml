name: Lint and Test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and Jest tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.22.3'
          cache: npm

      - name: Install lint and test tools
        run: npm ci

      - name: Lint HTML
        run: npm run lint:html

      - name: Lint CSS
        run: npm run lint:css

      - name: Lint JavaScript
        run: npm run lint:js

      - name: Initialize the test database
        env:
          MYSQL_PWD: root
        run: |
          sudo systemctl start mysql.service
          mysql --user=root <<'SQL'
          CREATE DATABASE colors_ci CHARACTER SET utf8mb4;
          CREATE USER 'colors_ci'@'127.0.0.1' IDENTIFIED BY 'colors_ci_password';
          GRANT SELECT, INSERT ON colors_ci.* TO 'colors_ci'@'127.0.0.1';
          SQL
          mysql --user=root colors_ci < database/schema.sql
          mysql --user=root colors_ci < tests/fixtures/test-user.sql

      - name: Run Jest unit and integration tests
        env:
          DB_HOST: '127.0.0.1'
          DB_NAME: colors_ci
          DB_USER: colors_ci
          DB_PASSWORD: colors_ci_password
        run: |
          php -S 127.0.0.1:8000 -t public scripts/router.php &
          php_pid=$!
          trap 'kill "$php_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:8000/index.html > /dev/null
          npm test -- --verbose
